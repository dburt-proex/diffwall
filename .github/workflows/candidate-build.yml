name: Candidate dependency and runtime build

on:
  push:
    branches: [compliance/control-plane-v0.1]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Resolve patched transitive dependency through npm
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update nanoid postcss vite source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean installation from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate committed JavaScript from TypeScript
        run: npm run build
      - name: Full tests against generated runtime
        run: npm test
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Export package-manager and compiler output
        if: always()
        shell: python
        run: |
          import base64, hashlib, json
          from pathlib import Path
          files = ["package-lock.json"] + [str(p) for p in sorted(Path("dist").rglob("*.js"))]
          payload = json.dumps({name: Path(name).read_text(encoding="utf-8") for name in files})
          encoded = base64.b64encode(payload.encode()).decode()
          print("GENERATED_SHA256:" + hashlib.sha256(payload.encode()).hexdigest())
          for start in range(0, len(encoded), 900):
              print("GENERATED_CHUNK:" + encoded[start:start + 900])
