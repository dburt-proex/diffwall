name: Compliance baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned manifest parser
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-compliance.txt
      - name: Regression tests for malformed and unsafe manifests
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate schema and tracked evidence paths
        run: python scripts/validate-compliance-baseline.py
