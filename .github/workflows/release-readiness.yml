name: Release readiness

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-readiness:
    name: Node ${{ matrix.node }} release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install exact direct dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify committed runtime matches source
        run: git diff --exit-code -- dist

      - name: Unit and compatibility tests
        id: unit_tests
        continue-on-error: true
        run: |
          mkdir -p artifacts/release-readiness
          npm test -- --reporter=verbose 2>&1 | tee artifacts/release-readiness/tests-node-${{ matrix.node }}.log

      - name: Large-diff benchmark
        run: |
          npm run bench:large-diff | tee artifacts/release-readiness/large-diff-node-${{ matrix.node }}.json

      - name: Verify release candidate structure
        run: |
          npm run release:verify | tee artifacts/release-readiness/release-verify-node-${{ matrix.node }}.json

      - name: Record dependency tree
        run: npm ls --all --json > artifacts/release-readiness/npm-tree-node-${{ matrix.node }}.json

      - name: High-severity dependency audit
        run: npm audit --audit-level=high --json > artifacts/release-readiness/npm-audit-node-${{ matrix.node }}.json

      - name: Record package inventory
        if: matrix.node == 20
        run: npm pack --dry-run --json > artifacts/release-readiness/npm-pack-node-${{ matrix.node }}.json

      - name: Build local action candidate archive
        if: matrix.node == 20
        run: |
          tar -czf artifacts/release-readiness/diffwall-action-candidate.tgz \
            action dist rules policy-packs package.json package-lock.json LICENSE
          sha256sum artifacts/release-readiness/diffwall-action-candidate.tgz \
            > artifacts/release-readiness/diffwall-action-candidate.sha256


      - name: Verify packaged runtime without source or installed dependencies
        if: matrix.node == 20
        shell: bash
        run: |
          candidate_dir=$(mktemp -d)
          tar -xzf artifacts/release-readiness/diffwall-action-candidate.tgz -C "$candidate_dir"
          cd "$candidate_dir"
          test ! -d node_modules
          test ! -d src
          test "$(node dist/cli.js scan --diff "$GITHUB_WORKSPACE/test/fixtures/safe-doc-change.diff" --quiet)" = "ALLOW"
          set +e
          node dist/cli.js scan --diff "$GITHUB_WORKSPACE/test/fixtures/review-dependency-change.diff" --quiet --fail-on-review > review.txt
          review_status=$?
          node dist/cli.js scan --diff "$GITHUB_WORKSPACE/test/fixtures/migration-drop-table.diff" --quiet --fail-on-halt > halt.txt
          halt_status=$?
          set -e
          test "$review_status" -eq 3
          test "$halt_status" -eq 2
          grep -qx REVIEW review.txt
          grep -qx HALT halt.txt

      - name: Bind evidence to exact checkout and toolchain
        if: always()
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p artifacts/release-readiness
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          fs.writeFileSync('artifacts/release-readiness/candidate.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(),
            node: process.version,
            npm: execFileSync('npm', ['--version'], {encoding:'utf8'}).trim(),
            run: process.env.EVIDENCE_RUN_ID,
            attempt: process.env.EVIDENCE_RUN_ATTEMPT
          }, null, 2) + '\n');
          NODE

      - name: Upload release-readiness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diffwall-release-readiness-node-${{ matrix.node }}
          path: |
            artifacts/release-readiness
            package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce unit-test result
        if: always()
        run: test "${{ steps.unit_tests.outcome }}" = "success"

  python-compatibility:
    name: Python ${{ matrix.python }} action-firewall evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: packages/action-firewall

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Run Action Firewall tests
        run: python -m unittest discover -s tests -v

      - name: Verify governed CLI routes
        run: |
          python -m diffwall.cli validate examples/actions/allow_read_file.json --json > /tmp/allow.json
          grep -q '"verdict": "ALLOW"' /tmp/allow.json

          set +e
          python -m diffwall.cli validate examples/actions/halt_delete_prod_db.json --json > /tmp/halt.json
          halt_status=$?
          set -e

          test "$halt_status" -eq 2
          grep -q '"verdict": "HALT"' /tmp/halt.json

  windows-compatibility:
    name: Windows Node 22 release evidence
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Prepare Windows evidence
        run: |
          mkdir -p artifacts/release-readiness-windows
          node --version
          npm --version
      - name: Clean Windows installation
        run: npm ci --no-audit --no-fund
      - name: Build on Windows
        run: npm run build
      - name: Verify Windows compiler parity
        run: git diff --exit-code -- dist
      - name: Full Windows unit and compatibility suite
        run: npm test -- --reporter=verbose 2>&1 | tee artifacts/release-readiness-windows/tests.log
      - name: Windows high-severity dependency audit
        run: npm audit --audit-level=high --json | tee artifacts/release-readiness-windows/npm-audit.json
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diffwall-release-readiness-windows-node-22
          path: artifacts/release-readiness-windows
          if-no-files-found: error
          retention-days: 30
