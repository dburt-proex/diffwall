version: '0.1'
system: DiffWall
repository: dburt-proex/diffwall
canonical_registry: dburt-proex/casa/governance/CONTROL-REGISTRY.yaml
canonical_registry_version: '0.1'
claim_boundary: no_certification_or_attestation_claim_without_independent_assurance
assessment_date: '2026-08-16'
states: [NOT_APPLICABLE, MISSING, PARTIAL, IMPLEMENTED, VERIFIED]
controls:
  GOV-001:
    status: IMPLEMENTED
    evidence: [README.md, STATUS.md, src, action/action.yml]
    note: Deterministic ALLOW/REVIEW/HALT routing and explicit claim boundaries are established.
  RSK-001:
    status: PARTIAL
    evidence: [src, demo/diffs, STATUS.md]
    gap: Change-risk scoring exists, but enterprise risk treatment and residual-risk acceptance are external.
  IAM-001:
    status: PARTIAL
    evidence: [dist/codeowners.js, .github/workflows/diffwall.yml]
    gap: Reviewer routing exists; repository access governance and periodic access review are not evidenced here.
  CHG-001:
    status: IMPLEMENTED
    evidence: [.github/workflows/ci.yml, .github/workflows/diffwall.yml, .github/workflows/release-readiness.yml, action/action.yml]
    note: Change-time evaluation, CI enforcement, controlled evidence delivery and release-readiness gates are core functions.
  LOG-001:
    status: PARTIAL
    evidence: [src/output, dist/output, STATUS.md]
    gap: Per-change evidence exists; long-lived canonical audit export and retention are explicitly not implemented.
  EVD-001:
    status: IMPLEMENTED
    evidence: [docs/live-validation-case-study.md, docs/ai-coding-governance-pilot.md, src/output, .github/workflows/release-readiness.yml]
  SEC-001:
    status: PARTIAL
    evidence: [SECURITY.md, demo/diffs, src, tests, .github/workflows/release-readiness.yml]
    gap: Release-readiness run 31989256302 failed the Node 20 high-severity dependency audit. Evidence artifact identified nanoid 3.3.16 as a high-severity transitive development dependency vulnerability (GHSA-2v37-7h3g-55p8) with a fix available; reproducible package-manager remediation and independent security assessment remain outstanding.
  INC-001:
    status: PARTIAL
    evidence: [STATUS.md, .github/workflows/release-readiness.yml]
    gap: No full incident-response SOP, tabletop, RCA and corrective-action register.
  AI-001:
    status: PARTIAL
    evidence: [docs/ai-coding-governance-pilot.md, action, src]
    gap: AI-assisted code-change governance exists; complete AI lifecycle inventory/TEVV/monitoring/decommissioning is outside this repo.
  DAT-001:
    status: MISSING
    evidence: []
    gap: No canonical data inventory, classification, retention, deletion and handling policy.
  SUP-001:
    status: MISSING
    evidence: []
    gap: No supplier/model-provider inventory and review process.
  BCM-001:
    status: MISSING
    evidence: []
    gap: No backup/restore/RTO/RPO policy or tested recovery evidence.
  REV-001:
    status: PARTIAL
    evidence: [.github/workflows/release-readiness.yml, STATUS.md, docs/ai-coding-governance-pilot.md]
    gap: Release readiness exists; recurring internal audit and management review are not formalized.
remediation:
  p0: [SEC-001, LOG-001, INC-001, DAT-001, SUP-001, BCM-001]
  p1: [RSK-001, IAM-001, AI-001, REV-001]
  external_assurance_gate: blocked_until_p0_closed_or_formally_risk_accepted
